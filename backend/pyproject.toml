[project]
name = "hendrickson-backend"
version = "0.1.0"
description = "Hendrickson AI-Driven QA Agent Harness - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pymongo>=4.8.0",
    "qdrant-client>=1.11.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "docker>=7.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "markdown-it-py>=3.0.0",
    "PyPDF2>=3.0.0",
    "tree-sitter>=0.23.0",
    "gitpython>=3.1.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
